<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CalcElf Rooster">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0B3"/><stop offset="1" stop-color="#FFD45B"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24313A" flood-opacity=".16"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
.out{stroke:#24313A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:#24313A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#fff;stroke:#24313A;stroke-width:10}
.pupil{fill:#1E2933}
.hi{fill:#fff}
.blush{fill:#F58AA1;opacity:.65}
</style></defs>
<circle cx="256" cy="256" r="226" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8"/>
<path d="M82 112h18M91 103v18M422 108h14M429 101v14" class="line" stroke="#fff" stroke-width="7" opacity=".7"/><circle cx="113" cy="386" r="7" fill="#fff" opacity=".7"/>
<!-- colorful tail --> <path d="M308 357q88 2 83-83-28 33-63 23 33-33 18-65-38 31-59 74" fill="#6E80E8" class="out"/>
<!-- body --> <ellipse cx="260" cy="366" rx="75" ry="63" fill="#E55050" class="out"/>
<!-- head side-ish --> <path d="M183 239q-2-83 72-96 78 8 90 80 0 74-88 90-61-9-74-74Z" fill="#F4C2A3" class="out"/>
<!-- comb --> <path d="m208 155q-10-49 23-39 12-43 35-2 33-32 38 14 29-11 29 29" fill="#ED5A55" class="out"/>
<!-- beak --> <path d="m342 224 50 22-48 25Z" fill="#FFC34C" class="out"/>
<!-- wattle --> <path d="M321 281q31 13 14 42-24-9-22-35" fill="#E34F57" class="out"/>
<!-- eye --> <ellipse cx="292" cy="206" rx="27" ry="35" class="eye"/><ellipse cx="300" cy="211" rx="11" ry="20" class="pupil"/><circle cx="305" cy="201" r="6" class="hi"/>
<!-- wing --> <path d="M224 350q44-38 88-4-12 44-59 43Z" fill="#FF7770" class="out"/>
</svg>