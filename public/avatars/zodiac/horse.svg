<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CalcElf Horse">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFDCC4"/><stop offset="1" stop-color="#FF9D85"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24313A" flood-opacity=".16"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
.out{stroke:#24313A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:#24313A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#fff;stroke:#24313A;stroke-width:10}
.pupil{fill:#1E2933}
.hi{fill:#fff}
.blush{fill:#F58AA1;opacity:.65}
</style></defs>
<circle cx="256" cy="256" r="226" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8"/>
<path d="M82 112h18M91 103v18M422 108h14M429 101v14" class="line" stroke="#fff" stroke-width="7" opacity=".7"/><circle cx="113" cy="386" r="7" fill="#fff" opacity=".7"/>
<!-- tail --> <path d="M320 356q94 38 78-47-7-31-34-35" class="line" stroke="#6C4A3F" stroke-width="26"/>
<!-- galloping body --> <ellipse cx="261" cy="370" rx="84" ry="59" fill="#9A6B4F" class="out" transform="rotate(-8 261 370)"/><path d="m223 397-41 26m100-21 44 27" class="line" stroke="#9A6B4F" stroke-width="24"/>
<!-- neck --> <path d="M220 326q-34-70 1-151l82 4 23 149Z" fill="#9A6B4F" class="out"/>
<!-- head side view --> <path d="M181 218q4-70 75-79 78-7 94 63l-16 69q-38 33-87 12-53-17-66-65Z" fill="#A97A5F" class="out"/>
<!-- mane + ears --> <path d="M206 177q-26-58 18-69 25 18 20 59m8-55q26-48 55-22 2 43-32 57" fill="#6B4639" class="out"/><path d="m216 152-8-53q32 6 37 45m59 1 22-46q23 20 8 56" fill="#A97A5F" class="out"/>
<!-- eye --> <ellipse cx="286" cy="196" rx="27" ry="35" class="eye"/><ellipse cx="294" cy="200" rx="11" ry="20" class="pupil"/><circle cx="299" cy="191" r="6" class="hi"/>
<!-- muzzle --> <ellipse cx="316" cy="242" rx="37" ry="26" fill="#C99B86" class="out"/><circle cx="333" cy="241" r="8" class="pupil"/><path d="M317 257q13 8 26-1" class="line" stroke-width="7"/>
</svg>