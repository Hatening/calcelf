<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CalcElf Snake">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4D9FF"/><stop offset="1" stop-color="#A4F0BE"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24313A" flood-opacity=".16"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
.out{stroke:#24313A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:#24313A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#fff;stroke:#24313A;stroke-width:10}
.pupil{fill:#1E2933}
.hi{fill:#fff}
.blush{fill:#F58AA1;opacity:.65}
</style></defs>
<circle cx="256" cy="256" r="226" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8"/>
<path d="M82 112h18M91 103v18M422 108h14M429 101v14" class="line" stroke="#fff" stroke-width="7" opacity=".7"/><circle cx="113" cy="386" r="7" fill="#fff" opacity=".7"/>
<!-- coiled body --> <path d="M181 365q-16 53 57 53 83 0 85-54" fill="none" stroke="#65C98A" stroke-width="48" class="out"/>
<!-- head --> <path d="M178 235q3-89 79-95 77 5 82 95-7 86-82 92-75-6-79-92Z" fill="#72D19A" class="out"/>
<!-- hood --> <path d="M200 176q56-74 112 0" fill="#8AE5AD" class="out"/>
<!-- eyes --> <ellipse cx="219" cy="234" rx="27" ry="35" class="eye"/><ellipse cx="298" cy="234" rx="27" ry="35" class="eye"/><ellipse cx="224" cy="235" rx="8" ry="22" class="pupil"/><ellipse cx="303" cy="235" rx="8" ry="22" class="pupil"/><circle cx="227" cy="225" r="6" class="hi"/><circle cx="306" cy="225" r="6" class="hi"/>
<!-- tongue --> <path d="M258 277v39m0-9-17 18m17-18 17 18" class="line" stroke="#E35F82" stroke-width="9"/>
</svg>