<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CalcElf Tiger">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8FFC1"/><stop offset="1" stop-color="#76DB72"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24313A" flood-opacity=".16"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
.out{stroke:#24313A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:#24313A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#fff;stroke:#24313A;stroke-width:10}
.pupil{fill:#1E2933}
.hi{fill:#fff}
.blush{fill:#F58AA1;opacity:.65}
</style></defs>
<circle cx="256" cy="256" r="226" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8"/>
<path d="M82 112h18M91 103v18M422 108h14M429 101v14" class="line" stroke="#fff" stroke-width="7" opacity=".7"/><circle cx="113" cy="386" r="7" fill="#fff" opacity=".7"/>
<!-- tail --> <path d="M319 367q89 29 80-54-4-31-31-38" class="line" stroke="#E69622" stroke-width="30"/>
<!-- body --> <ellipse cx="259" cy="366" rx="78" ry="65" fill="#F6A72E" class="out"/>
<!-- raised paw --> <ellipse cx="354" cy="294" rx="35" ry="54" fill="#F6A72E" class="out" transform="rotate(-19 354 294)"/><path d="M341 281q17 6 28 26" class="line" stroke-width="7"/>
<!-- head --> <path d="M155 239q4-101 101-105 98 6 106 100-7 96-106 98-96-5-101-93Z" fill="#F7AD33" class="out"/>
<!-- ears --> <path d="M184 176 151 132q37-6 59 28Z" fill="#F7AD33" class="out"/><path d="m327 171 33-45q26 35-4 67Z" fill="#F7AD33" class="out"/>
<!-- stripes --> <path d="m177 208 34 15m-35 19 35 10m106-50 34 17m-31 20 31 10" class="line" stroke-width="10"/>
<!-- eyes --> <ellipse cx="216" cy="239" rx="27" ry="35" class="eye"/><ellipse cx="302" cy="231" rx="27" ry="35" class="eye"/><ellipse cx="223" cy="244" rx="11" ry="20" class="pupil"/><ellipse cx="309" cy="236" rx="11" ry="20" class="pupil"/><circle cx="228" cy="236" r="6" class="hi"/><circle cx="314" cy="228" r="6" class="hi"/>
<circle cx="211" cy="281" r="12" class="blush"/><circle cx="313" cy="270" r="12" class="blush"/>
<path d="M249 270q9-11 18 0-9 11-18 0Z" fill="#E87C8C" class="out"/><path d="M257 279q-1 16-17 24M257 279q2 16 17 22" class="line" stroke-width="8"/>
</svg>