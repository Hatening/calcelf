<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CalcElf Rabbit">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9F2"/><stop offset="1" stop-color="#FFA6D1"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24313A" flood-opacity=".16"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
.out{stroke:#24313A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:#24313A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#fff;stroke:#24313A;stroke-width:10}
.pupil{fill:#1E2933}
.hi{fill:#fff}
.blush{fill:#F58AA1;opacity:.65}
</style></defs>
<circle cx="256" cy="256" r="226" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8"/>
<path d="M82 112h18M91 103v18M422 108h14M429 101v14" class="line" stroke="#fff" stroke-width="7" opacity=".7"/><circle cx="113" cy="386" r="7" fill="#fff" opacity=".7"/>
<!-- ears --> <ellipse cx="212" cy="134" rx="34" ry="88" fill="#FFF" class="out" transform="rotate(-9 212 134)"/><ellipse cx="296" cy="132" rx="35" ry="93" fill="#FFF" class="out" transform="rotate(7 296 132)"/><ellipse cx="212" cy="133" rx="14" ry="62" fill="#F5AABD" transform="rotate(-9 212 133)"/><ellipse cx="296" cy="132" rx="14" ry="67" fill="#F5AABD" transform="rotate(7 296 132)"/>
<!-- body --> <ellipse cx="273" cy="370" rx="72" ry="61" fill="#FFF" class="out"/><circle cx="354" cy="342" r="25" fill="#FFF" class="out"/>
<!-- head --> <ellipse cx="255" cy="248" rx="108" ry="102" fill="#FFF" class="out"/>
<!-- wink --> <ellipse cx="215" cy="239" rx="26" ry="35" class="eye"/><ellipse cx="220" cy="243" rx="11" ry="20" class="pupil"/><circle cx="225" cy="235" r="6" class="hi"/><path d="M290 244q20-22 37 0" class="line" stroke-width="10"/>
<ellipse cx="197" cy="277" rx="15" ry="10" class="blush"/><ellipse cx="306" cy="276" rx="15" ry="10" class="blush"/>
<!-- carrot --> <path d="M333 353q27 12 44 42l-45-9Z" fill="#FF9B45" class="out"/><path d="M351 349q-3-22 9-32m4 35q12-19 20-22" class="line" stroke="#5FB56A" stroke-width="9"/>
</svg>