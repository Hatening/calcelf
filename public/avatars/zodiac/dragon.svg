<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CalcElf Dragon">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4F7FF"/><stop offset="1" stop-color="#BBA7FF"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24313A" flood-opacity=".16"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
.out{stroke:#24313A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:#24313A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#fff;stroke:#24313A;stroke-width:10}
.pupil{fill:#1E2933}
.hi{fill:#fff}
.blush{fill:#F58AA1;opacity:.65}
</style></defs>
<circle cx="256" cy="256" r="226" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8"/>
<path d="M82 112h18M91 103v18M422 108h14M429 101v14" class="line" stroke="#fff" stroke-width="7" opacity=".7"/><circle cx="113" cy="386" r="7" fill="#fff" opacity=".7"/>
<!-- whiskers --> <path d="M168 258 111 248m59 27-62 13m227-30 60-18m-60 39 58 23" class="line" stroke="#5E9BCB" stroke-width="7"/>
<!-- body --> <ellipse cx="262" cy="367" rx="74" ry="63" fill="#50CFE3" class="out"/>
<!-- wing --> <path d="M323 218q76-52 77 38-9 48-58 30l-25-37Z" fill="#82E8F2" class="out"/>
<!-- neck/head --> <path d="M151 238q8-95 106-104 95 5 104 99-10 91-105 96-95-5-105-91Z" fill="#5ED6E4" class="out"/>
<!-- horns --> <path d="m194 161-21-52q36 4 50 39m92 8 22-52q31 11 25 46" fill="#FFD86B" class="out"/>
<!-- mane spikes --> <path d="m182 193-31-18 38-6m-27 47-37-1 34-24m143-5 36-13-25 38" fill="#44AFC8" class="out"/>
<!-- eyes --> <ellipse cx="215" cy="238" rx="27" ry="35" class="eye"/><ellipse cx="301" cy="229" rx="27" ry="35" class="eye"/><ellipse cx="222" cy="244" rx="11" ry="20" class="pupil"/><ellipse cx="309" cy="235" rx="11" ry="20" class="pupil"/><circle cx="227" cy="236" r="6" class="hi"/><circle cx="314" cy="227" r="6" class="hi"/>
<!-- beard --> <path d="M213 297q43 43 87 0l-12 42q-33 25-63 0Z" fill="#B8F4F3" class="out"/><path d="M246 274q12-13 24 0-12 13-24 0Z" fill="#3C9FB2" class="out"/>
</svg>