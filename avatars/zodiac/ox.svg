<!-- body --> <ellipse cx="260" cy="365" rx="83" ry="66" fill="#8A6557" class="out"/>
<!-- head --> <path d="M153 236q7-96 103-99 98 3 104 100-9 91-104 94-94-3-103-95Z" fill="#9B7567" class="out"/>
<!-- ears --> <path d="M157 205q-48-23-49 19 6 39 48 35M356 201q48-21 50 22-5 36-48 37" fill="#9B7567" class="out"/>
<!-- eyes --> <ellipse cx="216" cy="237" rx="27" ry="35" class="eye"/><ellipse cx="301" cy="237" rx="27" ry="35" class="eye"/><ellipse cx="218" cy="241" rx="11" ry="19" class="pupil"/><ellipse cx="304" cy="241" rx="11" ry="19" class="pupil"/><circle cx="223" cy="233" r="6" class="hi"/><circle cx="309" cy="233" r="6" class="hi"/>
<!-- muzzle --> <ellipse cx="259" cy="282" rx="58" ry="38" fill="#C8A59B" class="out"/><ellipse cx="237" cy="279" rx="10" ry="8" class="pupil"/><ellipse cx="281" cy="279" rx="10" ry="8" class="pupil"/><path d="M246 301q13 13 27 0" class="line" stroke-width="8"/>
